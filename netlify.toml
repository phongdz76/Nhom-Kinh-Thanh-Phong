[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.23.4"
  NEXT_TELEMETRY_DISABLED = "1"
  # These values are public website metadata, even when imported as secrets.
  # Database credentials, signing secrets and private API keys remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "SERVER_URL,CHAT_FRAME_ORIGIN,MEDIA_PUBLIC_URL,TURNSTILE_SITE_KEY,S3_ENDPOINT,S3_REGION,S3_BUCKET"

# The current Next.js adapter is auto-detected by Netlify. Do not add the
# legacy Next.js plugin or redirect every request to index.html.
[functions]
  node_bundler = "esbuild"

[context.deploy-preview]
  # CI runs pull requests without production credentials. Deploy only dev/main
  # through the gated GitHub workflow, using separate Netlify sites/databases.
  ignore = "exit 0"
